# Deployment da Aplicação
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soat-fiap-app
  namespace: soat-fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soat-fiap-app
  template:
    metadata:
      labels:
        app: soat-fiap-app
    spec:
      containers:
      - name: soat-fiap
        image: soat-fiap:latest
        ports:
        - containerPort: 80
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: SERVER_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: soat-fiap-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: soat-fiap-secrets
              key: DB_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
# Service da Aplicação
apiVersion: v1
kind: Service
metadata:
  name: soat-fiap-service
  namespace: soat-fiap
spec:
  selector:
    app: soat-fiap-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP