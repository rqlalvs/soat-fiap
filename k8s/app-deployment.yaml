apiVersion: apps/v1
kind: Deployment
metadata:
  name: soat-fiap-app
  namespace: soat-fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soat-fiap
  template:
    metadata:
      labels:
        app: soat-fiap
    spec:
      containers:
      - name: soat-fiap-api
        image: soat-fiap:latest  # Substituir pela imagem real
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: SERVER_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: soat-fiap-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: soat-fiap-secret
              key: DB_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: LOG_LEVEL
        - name: SWAGGER_ENABLE
          valueFrom:
            configMapKeyRef:
              name: soat-fiap-config
              key: SWAGGER_ENABLE
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"