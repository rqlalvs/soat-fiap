apiVersion: apps/v1
kind: Deployment
metadata:
  name: soat-fiap-app
  namespace: soat-fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soat-fiap-app
  template:
    metadata:
      labels:
        app: soat-fiap-app
    spec:
      containers:
        - name: app
          image: soat-fiap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: soat-fiap-app
  namespace: soat-fiap
spec:
  selector:
    app: soat-fiap-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP