apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: soat-fiap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
          ports:
            - containerPort: 3306
          args: ["--default-authentication-plugin=mysql_native_password", "--max_connections=200"]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: soat-fiap
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306