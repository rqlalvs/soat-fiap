apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soat-fiap-ingress
  namespace: soat-fiap
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: soat-fiap-app
            port:
              number: 80