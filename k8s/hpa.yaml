apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soat-fiap-app
  namespace: soat-fiap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soat-fiap-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60