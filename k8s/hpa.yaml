# HPA para Escalabilidade Automática
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: soat-fiap-hpa
  namespace: soat-fiap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soat-fiap-app
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70