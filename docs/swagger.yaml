basePath: /api/v1
definitions:
  domain.Categoria:
    enum:
    - LANCHE
    - ACOMPANHAMENTO
    - BEBIDA
    - SOBREMESA
    type: string
    x-enum-varnames:
    - CategoriaLanche
    - CategoriaAcompanhamento
    - CategoriaBebida
    - CategoriaSobremesa
  domain.Cliente:
    properties:
      cpf:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nome:
        type: string
      telefone:
        type: string
      updated_at:
        type: string
    type: object
  domain.ItemPedido:
    properties:
      nome:
        type: string
      observacao:
        type: string
      preco:
        type: number
      produto_id:
        type: string
      quantidade:
        type: integer
    type: object
  domain.Pagamento:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      external_id:
        type: string
      id:
        type: string
      payment_url:
        type: string
      pedido_id:
        type: string
      processed_at:
        type: string
      qr_code_data:
        type: string
      status:
        $ref: '#/definitions/domain.StatusPagamento'
      tipo:
        $ref: '#/definitions/domain.TipoPagamento'
      updated_at:
        type: string
      valor:
        type: number
    type: object
  domain.Pedido:
    properties:
      cliente_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      itens:
        items:
          $ref: '#/definitions/domain.ItemPedido'
        type: array
      status:
        $ref: '#/definitions/domain.StatusPedido'
      updated_at:
        type: string
      valor_total:
        type: number
    type: object
  domain.Produto:
    properties:
      categoria:
        $ref: '#/definitions/domain.Categoria'
      created_at:
        type: string
      descricao:
        type: string
      disponivel:
        type: boolean
      id:
        type: string
      nome:
        type: string
      preco:
        type: number
      updated_at:
        type: string
    type: object
  domain.StatusPagamento:
    enum:
    - PENDENTE
    - APROVADO
    - RECUSADO
    - CANCELADO
    type: string
    x-enum-varnames:
    - StatusPagamentoPendente
    - StatusPagamentoAprovado
    - StatusPagamentoRecusado
    - StatusPagamentoCancelado
  domain.StatusPedido:
    enum:
    - RECEBIDO
    - EM_PREPARACAO
    - CANCELADO
    - PRONTO
    - FINALIZADO
    type: string
    x-enum-varnames:
    - StatusRecebido
    - StatusEmPreparacao
    - StatusCancelado
    - StatusPronto
    - StatusFinalizado
  domain.TipoPagamento:
    enum:
    - PIX
    - CARTAO
    - DINHEIRO
    type: string
    x-enum-varnames:
    - TipoPagamentoPix
    - TipoPagamentoCartao
    - TipoPagamentoDinheiro
  handlers.AtualizarClienteRequest:
    properties:
      cpf:
        type: string
      email:
        type: string
      nome:
        type: string
      telefone:
        type: string
    type: object
  handlers.AtualizarProdutoRequest:
    properties:
      categoria:
        $ref: '#/definitions/domain.Categoria'
      descricao:
        type: string
      disponivel:
        type: boolean
      nome:
        type: string
      preco:
        type: number
    type: object
  handlers.AtualizarStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.StatusPedido'
    type: object
  handlers.AtualizarStatusResponse:
    properties:
      message:
        type: string
    type: object
  handlers.CancelarPagamentoResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  handlers.CheckoutResponse:
    properties:
      expires_at:
        type: string
      external_id:
        type: string
      message:
        type: string
      pagamento_id:
        type: string
      pedido_id:
        type: string
      qr_code:
        type: string
      status:
        type: string
      valor:
        type: number
    type: object
  handlers.ConsultarStatusPagamentoResponse:
    properties:
      expires_at:
        type: string
      external_id:
        type: string
      pagamento_id:
        type: string
      pedido_id:
        type: string
      processed_at:
        type: string
      qr_code:
        type: string
      status:
        type: string
      tipo:
        type: string
      valor:
        type: number
    type: object
  handlers.CriarClienteRequest:
    properties:
      cpf:
        type: string
      email:
        type: string
      nome:
        type: string
      telefone:
        type: string
    type: object
  handlers.CriarItemPedidoRequest:
    properties:
      observacao:
        type: string
      produto_id:
        type: string
      quantidade:
        type: integer
    type: object
  handlers.CriarPedidoRequest:
    properties:
      cliente_id:
        type: string
      itens:
        items:
          $ref: '#/definitions/handlers.CriarItemPedidoRequest'
        type: array
    type: object
  handlers.CriarProdutoRequest:
    properties:
      categoria:
        $ref: '#/definitions/domain.Categoria'
      descricao:
        type: string
      nome:
        type: string
      preco:
        type: number
    type: object
  handlers.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  handlers.SimularPagamentoResponse:
    properties:
      external_id:
        type: string
      message:
        type: string
      new_status:
        type: string
      status:
        type: string
    type: object
  handlers.WebhookPagamentoRequest:
    properties:
      action:
        type: string
      external_id:
        type: string
      status:
        $ref: '#/definitions/domain.StatusPagamento'
    type: object
  handlers.WebhookResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: API de exemplo com arquitetura hexagonal
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: API SOAT-FIAP
  version: "1.0"
paths:
  /checkout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do pedido
        in: body
        name: pedido
        required: true
        schema:
          $ref: '#/definitions/handlers.CriarPedidoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CheckoutResponse'
        "400":
          description: Erro ao criar pedido
          schema:
            type: string
      summary: Checkout do pedido
      tags:
      - pedidos
  /clientes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Cliente'
            type: array
        "500":
          description: Erro ao listar clientes
          schema:
            type: string
      summary: Listar clientes
      tags:
      - clientes
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.CriarClienteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Cliente'
        "400":
          description: Erro ao criar cliente
          schema:
            type: string
      summary: Criar cliente
      tags:
      - clientes
  /clientes/{id}:
    delete:
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Cliente deletado
          schema:
            type: string
        "500":
          description: Erro ao deletar cliente
          schema:
            type: string
      summary: Deletar cliente
      tags:
      - clientes
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cliente'
        "404":
          description: Cliente não encontrado
          schema:
            type: string
      summary: Buscar cliente por ID
      tags:
      - clientes
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      - description: Dados do cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.AtualizarClienteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cliente'
        "400":
          description: Erro ao atualizar cliente
          schema:
            type: string
      summary: Atualizar cliente
      tags:
      - clientes
  /clientes/cpf/{cpf}:
    get:
      parameters:
      - description: CPF do cliente
        in: path
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cliente'
        "404":
          description: Cliente não encontrado
          schema:
            type: string
      summary: Buscar cliente por CPF
      tags:
      - clientes
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - health
  /mock/pagamento/{external_id}/simular:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID externo do pagamento
        in: path
        name: external_id
        required: true
        type: string
      - description: Status para simular (APROVADO/RECUSADO)
        in: query
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SimularPagamentoResponse'
        "400":
          description: Erro ao simular pagamento
          schema:
            type: string
      summary: Simular pagamento (mock)
      tags:
      - pagamentos
  /pagamentos/{id}:
    get:
      parameters:
      - description: ID do pagamento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Pagamento'
        "404":
          description: Pagamento não encontrado
          schema:
            type: string
      summary: Buscar pagamento por ID
      tags:
      - pagamentos
  /pagamentos/{id}/cancelar:
    patch:
      parameters:
      - description: ID do pagamento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CancelarPagamentoResponse'
        "400":
          description: Erro ao cancelar pagamento
          schema:
            type: string
      summary: Cancelar pagamento
      tags:
      - pagamentos
  /pedidos:
    get:
      parameters:
      - description: Status do pedido
        in: query
        name: status
        type: string
      - description: ID do cliente
        in: query
        name: cliente_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Pedido'
            type: array
        "500":
          description: Erro ao listar pedidos
          schema:
            type: string
      summary: Listar pedidos
      tags:
      - pedidos
  /pedidos/{id}:
    get:
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Pedido'
        "404":
          description: Pedido não encontrado
          schema:
            type: string
      summary: Buscar pedido por ID
      tags:
      - pedidos
  /pedidos/{id}/pagamento/status:
    get:
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ConsultarStatusPagamentoResponse'
        "404":
          description: Pedido não encontrado
          schema:
            type: string
      summary: Consultar status de pagamento do pedido
      tags:
      - pagamentos
  /pedidos/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/handlers.AtualizarStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AtualizarStatusResponse'
        "400":
          description: Erro ao atualizar status do pedido
          schema:
            type: string
      summary: Atualizar status do pedido
      tags:
      - pedidos
  /pedidos/{pedido_id}/pagamento:
    get:
      parameters:
      - description: ID do pedido
        in: path
        name: pedido_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Pagamento'
        "404":
          description: Pagamento não encontrado
          schema:
            type: string
      summary: Consultar status de pagamento por pedido
      tags:
      - pagamentos
  /produtos:
    get:
      parameters:
      - description: Categoria do produto
        in: query
        name: categoria
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Produto'
            type: array
        "500":
          description: Erro ao listar produtos
          schema:
            type: string
      summary: Listar produtos
      tags:
      - produtos
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do produto
        in: body
        name: produto
        required: true
        schema:
          $ref: '#/definitions/handlers.CriarProdutoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Produto'
        "400":
          description: Erro ao criar produto
          schema:
            type: string
      summary: Criar produto
      tags:
      - produtos
  /produtos/{id}:
    delete:
      parameters:
      - description: ID do produto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Produto deletado
          schema:
            type: string
        "500":
          description: Erro ao deletar produto
          schema:
            type: string
      summary: Deletar produto
      tags:
      - produtos
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do produto
        in: path
        name: id
        required: true
        type: string
      - description: Dados do produto
        in: body
        name: produto
        required: true
        schema:
          $ref: '#/definitions/handlers.AtualizarProdutoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Produto'
        "400":
          description: Erro ao atualizar produto
          schema:
            type: string
      summary: Atualizar produto
      tags:
      - produtos
  /webhook/pagamento:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do webhook
        in: body
        name: webhook
        required: true
        schema:
          $ref: '#/definitions/handlers.WebhookPagamentoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WebhookResponse'
        "400":
          description: Erro ao processar webhook
          schema:
            type: string
      summary: Webhook de pagamento
      tags:
      - pagamentos
swagger: "2.0"
